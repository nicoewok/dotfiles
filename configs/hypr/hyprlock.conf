# =====================================================================
# HYPRLOCK CONFIGURATION: RETRO MONOCHROME OPSEC TERMINAL STATION
# =====================================================================

general {
    disable_loading_anti_aliasing = true
    hide_cursor = true
    grace = 0
    text_trim = false
}

# ---------------------------------------------------------------------
# BACKGROUND (Strict Solid Matte Canvas)
# ---------------------------------------------------------------------
background {
    monitor =
    color = rgb(1c1c1c)
    blur_passes = 0
    blur_size = 0
}

# ---------------------------------------------------------------------
# CLOCK READOUT (Top Right Terminal-Style Matrix Layout)
# ---------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo -e "SYS_STATUS: SECURE\nCRNT_TIME: $(date +'%H:%M:%S')\nCRNT_DATE: $(date +'%Y-%m-%d')"
    color = rgb(b19cd9)
    font_size = 22
    font_family = scientifica
    text_align = right
    
    position = -40, -40
    halign = right
    valign = top
}

# ---------------------------------------------------------------------
# NIXOS ASCII ART
# ---------------------------------------------------------------------
image {
    monitor =
    #TODO change to your user's Pictures path
    path = /home/../Pictures/nixos-ascii.png
    size = 300
    rounding = 0
    border_size = 0
    
    position = 0, 160
    halign = center
    valign = center
}

# ---------------------------------------------------------------------
# TUI / SECURE TTY PASSWORD REGISTER
# ---------------------------------------------------------------------
input-field {
    monitor =
    size = 460, 60
    outline_thickness = 1
    
    # Custom Character Mask Configuration
    dots_text_format = * # Mandates crisp text-based asterisks instead of circle paths
    dots_size = 0.35               # Retain scale mapping relative to entry height
    dots_spacing = 0.20            # Tracked spacing to keep bitmap letters from crowding
    dots_center = false
    
    outer_color = rgb(2a2a2a)       # Panel: Medium Graphite Frame
    inner_color = rgb(1c1c1c)       # Canvas: Dark Charcoal Fill
    font_color = rgb(f5f5dc)        # Text Primary: Soft Warm Beige
    check_color = rgb(87ceeb)       # Accent Pastel: Sky Blue
    fail_color = rgb(ffb7c5)        # Alert Stack: Pastel Pink
    
    fade_on_empty = false
    # Pure terminal-like input tracking prompt line
    #TODO change to your username and hostname
    placeholder_text = xxx@yyy:~ restrict -c sudo init █
    hide_input = false
    text_align = center
    font_family = scientifica       # Inherited by both placeholder and your custom asterisk mask
    font_size = 28
    rounding = 0                    # Strict 8-bit corners mandate
    
    position = 0, -45
    halign = center
    valign = center
}

# ---------------------------------------------------------------------
# OPSEC WARNING FOOTER (Enforced Purple Scientifica Pixel Font)
# ---------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:0] echo -e "---- [SECURITY PROTOCOL: LAYER_02_ACTIVE] ----\n UNSTABLE ENVIRONMENT DETECTED // AUTHORIZED ACCESS ONLY \n ALL TRANSACTION ATTEMPTS ARE CURRENTLY LOGGING TO DISK"
    color = rgb(ffb7c5)
    font_size = 18
    font_family = scientifica
    text_align = center
    
    position = 0, -150
    halign = center
    valign = center
}

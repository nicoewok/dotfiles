# ==============================================================================
# 1. DISPLAY GEOMETRY
# ==============================================================================
#TODO: your monitor setup
# Left Monitor (Secondary): Vertical 1440p panel
monitor = HDMI-A-1, 2560x1440@60, 0x0, 1, transform, 1
# Right Monitor (Primary): Landscape 1440p panel
monitor = DP-2, 2560x1440@60, 1440x715, 1

# ==============================================================================
# 2. AUTOSTART & ENVIRONMENT
# ==============================================================================
# Render the solid pastel beige background natively
exec-once = hyprpaper
exec-once = waybar
exec-once = mako

# Wayland environment variables for clean rendering
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,phinger-cursors-dark
env = QT_QPA_PLATFORM,wayland
env = WLR_NO_HARDWARE_CURSORS,1
#TODO: add your icon theme path here if you have a custom one
#env = XDG_DATA_DIRS,$XDG_DATA_DIRS:/home/.../.local/share/icons:/run/current-system/sw/share

# File explorer theming
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
# ==============================================================================
# 3. PASTEL AESTHETICS & BEHAVIOR
# ==============================================================================
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    
    # Minimalist gradient: Pastel Pink/Purple into Light Blue
    col.active_border = rgb(f5f5dc)
    col.inactive_border = rgb(b4befe)


    layout = dwindle
    resize_on_border = true
}

input {
    kb_layout = us
    follow_mouse = 1

    numlock_by_default = true
}

decoration {
    rounding = 2
    shadow {
    	enabled = false
    }
    blur {
        enabled = false
    }
}

cursor {
    no_hardware_cursors = true
    inactive_timeout = 0
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

# Turn off IPC communication to save CPU cycles
ipc = on

# ==============================================================================
# 4. WINDOW RULES (Tiling vs. Floating)
# ==============================================================================
# Force specific heavy applications to open on the primary landscape monitor
windowrule = monitor DP-2, match:class ^(Code|jetbrains-idea)$
windowrule = monitor DP-2, match:class ^(brave-browser)$

# Force reading/logging tools to default to the vertical monitor
windowrule = monitor HDMI-A-1, match:class ^(discord|vesktop|postman)$

# Enable "Windowed" mode automatically for system dialogs and small utilities
windowrule = float 1, match:class ^(pavucontrol|nm-connection-editor)$
windowrule = float 1, match:title ^(Open File|Save File)$
windowrule = monitor HDMI-A-1, match:title ^(media-visualizer)$
windowrule = size >600 >350, match:title ^(media-visualizer)$

# ==============================================================================
# KEYCHRON AUDIO & MEDIA KEYBINDINGS
# ==============================================================================
# Volume Knob Rotation (e = repeat while turning)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Volume Knob Click (Mute/Unmute Toggle)
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Dedicated Media Keys for Spotify / Browsers
bind  = , XF86AudioPlay, exec, playerctl play-pause
bind  = , XF86AudioNext, exec, playerctl next
bind  = , XF86AudioPrev, exec, playerctl previous


# ==============================================================================
# 5. DEVELOPER KEYBINDINGS
# ==============================================================================
$mainMod = SUPER

# --- Navigation ---
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d

# Resize: Change window dimensions interactively (SUPER + CTRL + ARROWS)
# binde allows you to hold down the keys for smooth scaling
binde = $mainMod CONTROL, right, resizeactive, 30 0
binde = $mainMod CONTROL, left, resizeactive, -30 0
binde = $mainMod CONTROL, up, resizeactive, 0 -30
binde = $mainMod CONTROL, down, resizeactive, 0 30

# --- Workspace Assignments ---
# Workspaces 1-4 mapped to Primary (Landscape)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Workspaces 5-8 mapped to Secondary (Vertical)
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

# --- Move Windows to Workspaces ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# --- Mouse Bindings for Floating Windows ---
# Hold Super + Left Click to drag floating windows around
bindm = $mainMod, mouse:272, movewindow
# Hold Super + Right Click to freely resize floating windows
bindm = $mainMod, mouse:273, resizewindow


# --- Window Management (The Tiling/Floating Hybrid) ---
bind = $mainMod, W, killactive, 
bind = $mainMod SHIFT, M, exit, 
bind = $mainMod, Space, togglefloating,  # Instantly pop a tiled window out into a float
bind = $mainMod, F, fullscreen, 
bind = $mainMod, P, pseudo, # Dwindle

bind = $mainMod, Tab, movetoworkspace, special
bind = $mainMod SHIFT, Tab, togglespecialworkspace,

bind = $mainMod SHIFT, left, movewindow, mon:HDMI-A-1
bind = $mainMod SHIFT, right, movewindow, mon:DP-2

# --- Power Management ---
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, hyprctl dispatch exit
bind = $mainMod, Escape, exec, ~/.local/bin/power-menu.sh

# --- Core Applications ---
bind = $mainMod, Q, exec, kitty
bind = $mainMod, B, exec, brave
bind = $mainMod, E, exec, thunar
bind = $mainMod, R, exec, kitty micro
bind = $mainMod, D, exec, vesktop
bind = $mainMod, C, exec, code
bind = $mainMod, I, exec, idea-ultimate
bind = $mainMod, G, exec, gitkraken
bind = $mainMod, A, exec, wofi --show drun
bind = $mainMod, V, exec, pavucontrol
bind = $mainMod, S, exec, spotify --enable-features=UseOzonePlatform --ozone-platform=wayland --disable-audio-output-resampler
bind = $mainMod SHIFT, S, exec, kitty --title "media-visualizer" --hold -e cava

# Map unified screenshot/screencast fuzzel deck to your Print Screen key
bind = , Print, exec, ~/.local/bin/capture-menu.sh


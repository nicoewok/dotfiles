add_newline = false
format = """
[┌─](格式 $sub) $username$directory$git_branch$git_status
[└─>](格式 $sub) """

[directory]
format = "[$path]($style) "
style = "bold #f5f5dc"
truncation_length = 3

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold #ffb7c5"

[git_status]
format = "([$all_status$ahead_behind](_$style) )"
style = "bold #ffb7c5"
modified = "!"
staged = "+"

[character]
success_symbol = "[OK](bold #f5f5dc)"
error_symbol = "[ERR](bold #ffb7c5)"
